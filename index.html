<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ember Swap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000;
    --card: #0b0b0b;
    --panel: #141414;
    --border: #1f1f1f;
    --border-hover: #2a2a2a;
    --text: #fff;
    --muted: #777;
    --muted-2: #555;
    --accent: #ff6b1a;
    --accent-soft: rgba(255,107,26,0.12);
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 6px; user-select: none;
  }
  .brand svg { display: block; width: 26px; height: 26px; }
  .brand .name {
    font-size: 18px; font-weight: 600; letter-spacing: -0.02em;
  }
  .brand .name span { color: var(--accent); }

  .powered {
    font-size: 11px; color: var(--muted);
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px;
  }
  .powered b { color: var(--accent); font-weight: 600; }

  .card {
    width: 100%; max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px;
    position: relative;
  }

  .panel {
    background: var(--panel);
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 14px;
    transition: border-color 0.15s;
  }
  .panel:focus-within { border-color: var(--border-hover); }

  .panel .top {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-bottom: 8px;
  }
  .panel .top .tag {
    font-size: 9px; padding: 2px 6px; border-radius: 4px;
    background: var(--accent-soft); color: var(--accent);
    font-weight: 700; letter-spacing: 0.04em;
  }

  .panel .main {
    display: flex; align-items: center; gap: 10px;
  }
  .panel input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 22px; font-weight: 500;
    font-family: inherit; padding: 4px 0;
    -webkit-appearance: none;
  }
  .panel input::placeholder { color: var(--muted-2); }

  .asset {
    display: flex; align-items: center; gap: 8px;
    background: #1c1c1c; border: 1px solid var(--border);
    border-radius: 999px; padding: 5px 10px 5px 5px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .asset:hover { background: #232323; border-color: var(--border-hover); }
  .asset .ico {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #000;
    background: var(--accent);
    flex-shrink: 0;
  }
  .asset select {
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 15px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    padding-right: 2px;
  }
  .asset select option { background: #141414; color: #fff; }

  .flip {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 34px; height: 34px; border-radius: 50%;
    background: #1a1a1a; border: 4px solid var(--card);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 2; transition: background 0.15s;
    padding: 0;
  }
  .flip:hover { background: var(--accent); }
  .flip:hover svg { stroke: #000; }
  .flip svg { stroke: var(--accent); transition: stroke 0.15s; }

  .cta {
    width: 100%; margin-top: 14px;
    background: var(--accent); color: #000;
    border: none; font-family: inherit;
    font-size: 15px; font-weight: 700;
    padding: 16px; border-radius: 14px;
    cursor: pointer; transition: opacity 0.15s, transform 0.05s;
    -webkit-appearance: none;
    touch-action: manipulation;
    text-decoration: none;
    display: block;
    text-align: center;
  }
  .cta:hover { opacity: 0.9; }
  .cta:active { transform: scale(0.99); }

  .disclosure {
    max-width: 440px; margin-top: 16px;
    font-size: 11px; color: var(--muted-2);
    text-align: center; line-height: 1.6;
    padding: 0 12px;
  }

  .spin {
    display: inline-block; width: 10px; height: 10px;
    border: 2px solid rgba(255,107,26,0.25);
    border-top-color: var(--accent); border-radius: 50%;
    animation: rot 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  @media (max-width: 380px) {
    .panel input { font-size: 20px; }
    .asset select { font-size: 14px; }
    .brand .name { font-size: 16px; }
  }
</style>
</head>
<body>

  <div class="brand">
    <svg viewBox="0 0 26 26" fill="none">
      <path d="M13 1L23 7V19L13 25L3 19V7L13 1Z"
            stroke="#ff6b1a" stroke-width="2" stroke-linejoin="round"/>
      <path d="M13 8L18 11V16L13 19L8 16V11L13 8Z" fill="#ff6b1a"/>
    </svg>
    <div class="name">Ember<span>Swap</span></div>
  </div>

  <div class="powered">Powered by <b>Xgram</b></div>

  <div class="card">

    <div class="panel" style="border-bottom-left-radius:0;border-bottom-right-radius:0;">
      <div class="top">
        <span>You pay</span>
      </div>
      <div class="main">
        <input id="fromAmount" type="text" inputmode="decimal" placeholder="0.0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <div class="asset">
          <div class="ico" id="fromIco">B</div>
          <select id="fromAsset"></select>
        </div>
      </div>
    </div>

    <button class="flip" id="flipBtn" aria-label="Switch assets">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5h8M8 2l3 3-3 3M11 9H3M6 6l-3 3 3 3"/>
      </svg>
    </button>

    <div class="panel" style="border-top-left-radius:0;border-top-right-radius:0;">
      <div class="top">
        <span>You receive</span>
        <span class="tag" id="estTag" style="display:none;">ESTIMATE</span>
      </div>
      <div class="main">
        <input id="toAmount" type="text" placeholder="0.0" readonly />
        <div class="asset">
          <div class="ico" id="toIco" style="background:#627eea;">E</div>
          <select id="toAsset"></select>
        </div>
      </div>
    </div>

    <a class="cta" id="swapBtn"
       href="https://xgram.io?refId=6ab96b5357dd2"
       target="_blank" rel="noopener noreferrer">
      Swap
    </a>
  </div>

  <p class="disclosure">
    Estimate only. Final rate is set by Xgram when you complete your swap.
  </p>

<script>
  const REF_URL = "https://xgram.io?refId=6ab96b5357dd2";

  // CoinGecko IDs for the assets we support.
  // BTC/ETH/LTC/BCH/DOGE/SOL/XMR have public prices. USDT is pegged to $1.
  const ASSETS = [
    { id: "BTC",  ticker: "BTC",  chain: "Bitcoin",      color: "#f7931a", cg: "bitcoin" },
    { id: "ETH",  ticker: "ETH",  chain: "Ethereum",     color: "#627eea", cg: "ethereum" },
    { id: "LTC",  ticker: "LTC",  chain: "Litecoin",     color: "#a5a8a9", cg: "litecoin" },
    { id: "BCH",  ticker: "BCH",  chain: "Bitcoin Cash", color: "#8dc351", cg: "bitcoin-cash" },
    { id: "DOGE", ticker: "DOGE", chain: "Dogecoin",     color: "#c2a633", cg: "dogecoin" },
    { id: "SOL",  ticker: "SOL",  chain: "Solana",       color: "#14f195", cg: "solana" },
    { id: "XMR",  ticker: "XMR",  chain: "Monero",       color: "#ff6600", cg: "monero" },
    { id: "USDT", ticker: "USDT", chain: "Tether",       color: "#26a17b", cg: "tether" },
  ];

  const $from  = document.getElementById("fromAsset");
  const $to    = document.getElementById("toAsset");
  const $amt   = document.getElementById("fromAmount");
  const $out   = document.getElementById("toAmount");
  const $fIco  = document.getElementById("fromIco");
  const $tIco  = document.getElementById("toIco");
  const $tag   = document.getElementById("estTag");

  for (const a of ASSETS) {
    $from.add(new Option(a.ticker, a.id));
    $to.add(new Option(a.ticker, a.id));
  }
  $from.value = "BTC";
  $to.value   = "ETH";

  function assetById(id) { return ASSETS.find(a => a.id === id); }

  function syncIco(el, id) {
    const a = assetById(id);
    el.textContent = a.ticker[0];
    el.style.background = a.color;
  }

  function refreshTo() {
    const fromId = $from.value;
    const prev   = $to.value;
    $to.innerHTML = "";
    for (const a of ASSETS) {
      if (a.id === fromId) continue;
      $to.add(new Option(a.ticker, a.id));
    }
    if ([...$to.options].some(o => o.value === prev)) $to.value = prev;
  }

  syncIco($fIco, $from.value);
  syncIco($tIco, $to.value);
  refreshTo();
  syncIco($tIco, $to.value);

  // ── Price fetch ────────────────────────────────────────
  const priceCache = {};       // { coingeckoId: usdPrice }
  const CACHE_MS = 60_000;     // refresh prices every minute
  let lastFetch = 0;
  let fetching = false;

  async function ensurePrices() {
    if (Date.now() - lastFetch < CACHE_MS) return;
    if (fetching) return;
    fetching = true;
    try {
      const ids = ASSETS.map(a => a.cg).join(",");
      const r = await fetch(
        `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`
      );
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      for (const a of ASSETS) {
        if (data[a.cg]?.usd) priceCache[a.id] = data[a.cg].usd;
      }
      lastFetch = Date.now();
    } catch (e) {
      // Silent — estimate just won't show. User still gets the Swap button.
      console.warn("Price fetch failed:", e.message);
    } finally {
      fetching = false;
    }
  }

  // ── Estimate ───────────────────────────────────────────
  let timer = null;

  async function estimate() {
    const amtStr = $amt.value.trim();
    const fromId = $from.value;
    const toId   = $to.value;

    if (!amtStr || isNaN(+amtStr) || +amtStr <= 0 || fromId === toId) {
      $out.value = "";
      $tag.style.display = "none";
      return;
    }

    await ensurePrices();

    const pFrom = priceCache[fromId];
    const pTo   = priceCache[toId];

    if (!pFrom || !pTo) {
      $out.value = "";
      $tag.style.display = "none";
      return;
    }

    const usdValue = parseFloat(amtStr) * pFrom;
    const outAmt = usdValue / pTo;
    $out.value = outAmt.toFixed(6);
    $tag.style.display = "inline-block";
  }

  // ── Events ─────────────────────────────────────────────
  $amt.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(estimate, 350);
  });

  $from.addEventListener("change", () => {
    syncIco($fIco, $from.value);
    refreshTo();
    syncIco($tIco, $to.value);
    estimate();
  });

  $to.addEventListener("change", () => {
    syncIco($tIco, $to.value);
    estimate();
  });

  document.getElementById("flipBtn").addEventListener("click", () => {
    const f = $from.value, t = $to.value;
    $from.value = t;
    refreshTo();
    $to.value = f;
    syncIco($fIco, $from.value);
    syncIco($tIco, $to.value);
    estimate();
  });
</script>
</body>
</html>
